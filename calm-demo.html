<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound, from scratch — Piano Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ebony:#0E0B0A; --panel:#171110; --ivory:#ECE3D2; --ivory-dim:#B9AC98;
  --muted:#8A7D6C; --faint:#5E534A; --line:#2E2520; --verdigris:#6DB59B; --verd-deep:#254539;
  --f-disp:'Fraunces',Georgia,serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ebony);color:var(--ivory);font-family:var(--f-body);line-height:1.65;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--verdigris);outline-offset:3px;border-radius:6px}

/* calm top bar: just orientation, nothing to act on */
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:1.1rem clamp(1.1rem,5vw,2rem);color:var(--muted)}
.top .where{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}
.dots{display:flex;gap:.5rem}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.dots i.on{background:var(--verdigris);transform:scale(1.3)}

/* one idea, centered, with room to breathe */
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  width:100%;max-width:600px;margin:0 auto;padding:1rem clamp(1.2rem,6vw,2.4rem) 2rem;text-align:center}
.card{width:100%;animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--verdigris);margin-bottom:1rem}
h1{font-family:var(--f-disp);font-weight:500;font-size:clamp(2.4rem,9vw,3.4rem);line-height:1.02;margin-bottom:1rem}
.line{font-size:clamp(1.05rem,3.6vw,1.22rem);color:var(--ivory-dim);max-width:34ch;margin:0 auto 2.4rem}

/* the toy: string-length rows you can see and hear */
.toy{display:flex;flex-direction:column;gap:1.5rem;margin-bottom:2rem}
.string{display:flex;align-items:center;gap:1rem}
.pluck{flex:0 0 auto;width:60px;height:60px;border-radius:50%;border:2px solid var(--verd-deep);
  background:rgba(109,181,155,.06);color:var(--verdigris);font-size:1.3rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:border-color .2s,background .2s,transform .12s}
.pluck:hover{border-color:var(--verdigris)}
.pluck:active{transform:scale(.94)}
.track{flex:1;height:56px;display:flex;align-items:center;position:relative}
.bar{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--verdigris),var(--verd-deep));position:relative;transition:width .4s ease}
.bar::after{content:"";position:absolute;inset:-16px 0;border-radius:8px;background:var(--verdigris);opacity:0;transition:opacity .5s}
.string.ring .bar::after{opacity:.14;transition:opacity .05s}
.tag{position:absolute;left:0;top:38px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;color:var(--muted)}
.ratio{font-family:var(--f-mono);font-size:1.1rem;letter-spacing:.28em;color:var(--verdigris);margin:.4rem 0 1.6rem}

/* one clear primary action, big target */
.hear{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--f-body);font-size:1.05rem;
  background:var(--verd-deep);color:var(--ivory);border:1px solid var(--verdigris);border-radius:40px;
  padding:.95rem 1.8rem;cursor:pointer;transition:background .2s,transform .12s;min-height:52px}
.hear:hover{background:#2f5648}
.hear:active{transform:scale(.97)}
.note{font-size:.92rem;color:var(--muted);max-width:32ch;margin:1.8rem auto 0}

/* calm, predictable navigation */
.nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  width:100%;max-width:600px;margin:0 auto;padding:1.4rem clamp(1.2rem,6vw,2.4rem) 2.2rem}
.nav button{font-family:var(--f-body);font-size:1rem;background:none;border:1px solid var(--line);
  color:var(--ivory-dim);border-radius:30px;padding:.75rem 1.4rem;cursor:pointer;min-height:48px;transition:border-color .2s,color .2s,opacity .2s}
.nav button:hover:not(:disabled){border-color:var(--verdigris);color:var(--ivory)}
.nav button:disabled{opacity:.28;cursor:default}
.count{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;color:var(--faint)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <span class="where">Sound · from scratch</span>
  <div class="dots" id="dots" aria-hidden="true"></div>
</div>

<main>
  <section class="card" id="card" aria-live="polite"></section>
</main>

<nav class="nav" aria-label="Move between ideas">
  <button id="prev">&larr; Back</button>
  <span class="count" id="count"></span>
  <button id="next">Next &rarr;</button>
</nav>

<script>
/* ---- audio: one gentle voice, tap-only, no autoplay ---- */
let AC=null,MASTER=null;
function audio(){
  if(AC)return AC;
  try{const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
    AC=new C(); MASTER=AC.createGain(); MASTER.gain.value=0.4;
    const comp=AC.createDynamicsCompressor(); MASTER.connect(comp); comp.connect(AC.destination);
  }catch(e){AC=null;} return AC;
}
function ready(){const a=audio(); if(a&&a.state==="suspended")a.resume(); return a;}
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function voice(midi,at,dur){
  const ac=AC; if(!ac)return; const f=mtof(midi),g=ac.createGain();
  [[1,1],[2,.32],[3,.12],[4,.05]].forEach(function(p){
    const o=ac.createOscillator(); o.type="sine"; o.frequency.value=f*p[0];
    const og=ac.createGain(); og.gain.value=p[1]; o.connect(og); og.connect(g);
    o.start(at); o.stop(at+dur+.25);
  });
  const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=Math.min(7000,f*7);
  g.connect(lp); lp.connect(MASTER);
  g.gain.setValueAtTime(.0001,at); g.gain.exponentialRampToValueAtTime(.9,at+.006);
  g.gain.exponentialRampToValueAtTime(.0001,at+dur);
}

/* ---- the deck: one atomic idea per entry ---- */
const DECK=[
 {eyebrow:"Start here", title:"One string", line:"Pluck a string and it shivers. That shiver, carried through the air, is what your ear hears as a single note.",
  strings:[{w:100,midi:57,tag:"tap to pluck"}], note:"Every idea after this is built from this one thing."},
 {eyebrow:"Two notes that agree", title:"The octave", line:"Halve the string’s length and it sings the very same note — just higher. The first and deepest agreement in music.",
  strings:[{w:100,midi:57,tag:"full length · low"},{w:50,midi:69,tag:"half length · high"}], ratio:"2 : 1", both:true,
  note:"Half the length, twice as fast — and we hear ‘the same note.’"},
 {eyebrow:"Two notes that agree", title:"The fifth", line:"Now take two-thirds of the string. A different, brighter agreement — the note the whole circle of fifths is built on.",
  strings:[{w:100,midi:57,tag:"full length · low"},{w:66.6,midi:64,tag:"two-thirds · high"}], ratio:"3 : 2", both:true,
  note:"The next-simplest ratio after the octave — that’s why it sounds so settled."}
];

let idx=0;
const cardEl=document.getElementById("card"), dotsEl=document.getElementById("dots"), countEl=document.getElementById("count");
const prevBtn=document.getElementById("prev"), nextBtn=document.getElementById("next");

dotsEl.innerHTML=DECK.map(function(){return '<i></i>';}).join("");

function pluck(el,midi){
  ready(); voice(midi, AC?AC.currentTime:0, midi>66?1.3:1.6);
  el.classList.remove("ring"); void el.offsetWidth; el.classList.add("ring");
}
function render(){
  const c=DECK[idx];
  let h='<div class="eyebrow">'+c.eyebrow+'</div><h1>'+c.title+'</h1><div class="line">'+c.line+'</div>';
  h+='<div class="toy">';
  c.strings.forEach(function(s,i){
    h+='<div class="string" data-i="'+i+'" data-midi="'+s.midi+'">'
      +'<button class="pluck" aria-label="Pluck the '+s.tag+' string">&#9654;</button>'
      +'<div class="track"><div class="bar" style="width:'+s.w+'%"></div><span class="tag">'+s.tag+'</span></div></div>';
  });
  h+='</div>';
  if(c.ratio)h+='<div class="ratio">'+c.ratio+'</div>';
  if(c.both)h+='<button class="hear" id="hearBoth">&#9834; hear them together</button>';
  if(c.note)h+='<div class="note">'+c.note+'</div>';
  cardEl.innerHTML=h;

  cardEl.querySelectorAll(".string").forEach(function(st){
    const midi=+st.dataset.midi;
    st.addEventListener("click",function(){pluck(st,midi);});
  });
  const hb=document.getElementById("hearBoth");
  if(hb)hb.addEventListener("click",function(){
    ready(); const t=AC?AC.currentTime:0;
    c.strings.forEach(function(s,i){ voice(s.midi,t+i*.5,1.5); });
    cardEl.querySelectorAll(".string").forEach(function(st,i){
      setTimeout(function(){st.classList.remove("ring");void st.offsetWidth;st.classList.add("ring");}, i*500);
    });
  });

  dotsEl.querySelectorAll("i").forEach(function(d,i){d.classList.toggle("on",i===idx);});
  countEl.textContent=(idx+1)+" of "+DECK.length;
  prevBtn.disabled=idx===0; nextBtn.disabled=idx===DECK.length-1;
}
function go(n){ idx=Math.max(0,Math.min(DECK.length-1,n)); render(); }
prevBtn.addEventListener("click",function(){go(idx-1);});
nextBtn.addEventListener("click",function(){go(idx+1);});
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")go(idx+1); else if(e.key==="ArrowLeft")go(idx-1);
});
/* prime audio on first touch (mobile starts it suspended) */
["pointerdown","touchend","keydown"].forEach(function(ev){
  window.addEventListener(ev,function u(){ready();window.removeEventListener(ev,u);},{once:true,passive:true});
});
render();
</script>
</body>
</html>
